storage:
  postgres:
    postgres_db:
      hostname: postgres
      port: 5432
      db_name: dagster
      # SQLAlchemy 2.1 defaults postgresql:// to psycopg 3; dagster-postgres ships psycopg2.
      scheme: postgresql+psycopg2
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD

concurrency:
  pools:
    # Every pool runs one at a time: startgg_api (shared API rate limit),
    # spark_lakehouse (bronze, silver, gold, training and maintenance: one
    # memory-heavy run at a time in dagster-code).
    default_limit: 1
    granularity: run

run_monitoring:
  enabled: true
  free_slots_after_run_end_seconds: 300
  # Fails a run that outlives its dagster/max_runtime tag (see
  # pipeline/dagster_defs/run_limits.py), so a dead run worker frees its pool
  # slot. Untagged runs (asset-page launches) get the longest limit.
  max_runtime_seconds: 19800

telemetry:
  enabled: false
