storage:
  postgres:
    postgres_db:
      hostname: postgres
      port: 5432
      db_name: dagster
      # SQLAlchemy 2.1 defaults postgresql:// to psycopg 3; dagster-postgres ships psycopg2.
      scheme: postgresql+psycopg2
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD

concurrency:
  pools:
    # Every pool runs one at a time: startgg_api (shared API rate limit),
    # spark_lakehouse (one Spark driver; bronze checkpoints), gold, training.
    default_limit: 1
    granularity: run

run_monitoring:
  enabled: true
  free_slots_after_run_end_seconds: 300

telemetry:
  enabled: false
